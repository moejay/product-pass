name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run lint:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: product-pass-release-${{ github.ref_name }}
          path: |
            release/
            dist/firefox/
          if-no-files-found: error

  github-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: product-pass-release-${{ github.ref_name }}
      - run: cd release && sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber

  chrome-web-store:
    needs: package
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency:
      group: chrome-web-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: product-pass-release-${{ github.ref_name }}
      - run: cd release && sha256sum --check SHA256SUMS
      - name: Submit Chrome Web Store update
        env:
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          CHROME_PUBLISHER_ID: d409e975-649c-4ff0-aeaa-1924e433b050
          CHROME_EXTENSION_ID: dplonfnpogllhgljkhjdmiomgdjfehgd
        run: node scripts/publish-chrome.mjs "release/product-pass-${GITHUB_REF_NAME#v}-chrome.zip" "${GITHUB_REF_NAME#v}"

  firefox-amo:
    needs: package
    runs-on: ubuntu-latest
    environment: firefox-amo
    concurrency:
      group: firefox-amo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: product-pass-release-${{ github.ref_name }}
      - run: cd release && sha256sum --check SHA256SUMS
      - name: Submit listed Firefox update
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >-
          npx --no-install web-ext sign
          --source-dir dist/firefox
          --artifacts-dir web-ext-artifacts
          --channel listed
          --approval-timeout 0
          --upload-source-code "release/product-pass-${GITHUB_REF_NAME#v}-source.zip"
